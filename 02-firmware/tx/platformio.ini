[platformio]
default_envs = esp32s3_existing

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15@2.6.2
    adafruit/Adafruit BusIO@1.17.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.5
    olikraus/U8g2@2.36.15
build_flags = -Wall -Wextra

[env:esp32s3_existing]
build_flags = ${env.build_flags} -D SONAR_PCM5102A=0

[env:esp32s3_pcm5102a]
build_flags = ${env.build_flags} -D SONAR_PCM5102A=1

[env:esp32s3_headless]
build_flags = ${env.build_flags} -D SONAR_PCM5102A=0 -D SONAR_ENABLE_DISPLAYS=0
